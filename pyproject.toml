[project]
name = "ddharmon"
version = "1.0.0"
description = "Data Dictionary Harmonization Tool for ARPA-H Activity 2 multi-omics data harmonization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core data processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",

    # HTTP client for API integration
    "httpx>=0.28.1",

    # Environment and config
    "python-dotenv>=1.2.1",

    # CLI
    "click>=8.1.0",

    # File formats
    "openpyxl>=3.1.5",
    "pyarrow>=15.0.0",

    # Fuzzy matching for lexical tier
    "rapidfuzz>=3.0.0",

    # Text encoding normalization (mojibake, unicode)
    "ftfy>=6.1.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.39.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scipy>=1.11.0",
]
clustering = [
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.6",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
]
bertopic = [
    "bertopic>=0.16.0",
]
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
]
all = [
    "ddharmon[embeddings,llm,viz,clustering,bertopic,ui]",
    "nest-asyncio>=1.6.0",
]
dev = [
    "ddharmon[all]",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "pyright>=1.1.350",
]
notebooks = [
    "ddharmon[all]",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
]

[project.scripts]
ddharmon = "ddharmon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddharmon"]

# NOTE: We use the Biomapper2 API (not the library) for entity resolution.
# This keeps ddharmon focused on data dictionary harmonization while
# treating biomapper2 as an external service.

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*_integration.py" = ["E402"]
"tests/test_visualization.py" = ["E402"]
# The GUI API mirrors the JS frontend's camelCase request bodies on purpose.
"ui/backend/app.py" = ["N815"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = [
    "notebooks/",
    "tests/",
]
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "integration: mark test as integration test (requires API keys, may incur costs)",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "pyright>=1.1.350",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

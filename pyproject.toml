[project]
name = "ddharmon"
version = "1.3.0"
description = "Data Dictionary Harmonization Tool: cluster equivalent variables across data dictionaries and anchor them to Common Data Elements (CDEs)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Trent Leslie", email = "trent.leslie@phenomehealth.org" },
    { name = "Bhargav Vemuri", email = "bhargav.vemuri@phenomehealth.org" },
]
keywords = [
    "data harmonization",
    "common data elements",
    "CDE",
    "data dictionary",
    "biomedical",
    "embeddings",
    "clustering",
    "metadata",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # Core data processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",

    # HTTP client for API integration
    "httpx>=0.28.1",

    # Environment and config
    "python-dotenv>=1.2.1",

    # CLI
    "click>=8.1.0",

    # File formats
    "openpyxl>=3.1.5",
    "pyarrow>=15.0.0",

    # Fuzzy matching for lexical tier
    "rapidfuzz>=3.0.0",

    # Text encoding normalization (mojibake, unicode)
    "ftfy>=6.1.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.39.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scipy>=1.11.0",
]
clustering = [
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.6",
    # Direct floor on numba (pulled transitively via umap-learn -> pynndescent).
    # numba caps numpy (0.64.0 requires numpy<2.5); flooring it here stops the
    # resolver from escaping to an ancient numba with a loose numpy pin — which
    # is what lets a premature numpy>=2.5 bump silently drag the whole
    # numba/llvmlite/pynndescent/bertopic chain back to 2021-era versions.
    # Relax/raise when a numba release supports numpy 2.5.
    "numba>=0.64.0",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
]
bertopic = [
    "bertopic>=0.16.0",
]
# Reading a composite score's definition out of an uploaded/fetched PDF or Word supplement
# (harmonization/score_sources.py). A published score's item table often lives in the supplement, and
# supplements are routinely .docx. HTML and repo sources need no extra dep (httpx is core; HTML is
# stripped without bs4), and both document paths import their parser lazily — so paste/URL/repo
# ingestion works without this extra installed.
sources = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]
all = [
    "ddharmon[embeddings,llm,viz,clustering,bertopic,sources]",
    "nest-asyncio>=1.6.0",
]
dev = [
    "ddharmon[all]",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "pyright>=1.1.350",
]
notebooks = [
    "ddharmon[all]",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
]

[project.scripts]
ddharmon = "ddharmon.cli:main"

[project.urls]
Homepage = "https://github.com/Phenome-Health/ddharmon"
Repository = "https://github.com/Phenome-Health/ddharmon"
Documentation = "https://github.com/Phenome-Health/ddharmon#readme"
Issues = "https://github.com/Phenome-Health/ddharmon/issues"
Changelog = "https://github.com/Phenome-Health/ddharmon/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddharmon"]

# NOTE: Entity resolution is treated as an external service rather than a library
# dependency, keeping ddharmon focused on data-dictionary harmonization.

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*_integration.py" = ["E402"]
"tests/test_visualization.py" = ["E402"]
# `Z` is the scipy linkage-matrix convention (scipy.cluster.hierarchy) — keep it uppercase.
"tests/test_clustering.py" = ["N806"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = [
    "notebooks/",
    "tests/",
]
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "integration: real network access, model downloads, or API keys; may be slow or incur cost. Deselected in the fast CI gate via `-m 'not integration'` (see .github/workflows/ci.yml).",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "pyright>=1.1.350",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
